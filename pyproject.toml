[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opticfilm-linux"
version = "0.1.0"
description = "Native Linux slide scanning and enhancement for the Plustek OpticFilm 135i"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.3",
    "tifffile>=2024.5.22",
    "opencv-python-headless>=4.9",
]

[project.scripts]
ofscan = "opticfilm_linux.cli:main"
# Needs the distribution's PySide6 and Kirigami, which are deliberately not dependencies:
# the PyPI PySide6 wheel bundles its own Qt and cannot load the system Kirigami plugin.
opticfilm = "opticfilm_linux.app.qt.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opticfilm_linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not hardware and not qt'"
markers = [
    "hardware: needs the real scanner plugged in (read-only); excluded by default",
    "qt: needs the distribution's PySide6 and Kirigami (headless smoke test); excluded by default",
]

[tool.coverage.run]
# The Qt layer needs PySide6 and Kirigami; the optional Fedora CI job exercises it.
omit = ["*/opticfilm_linux/app/qt/*"]

[tool.hatch.build.targets.wheel.force-include]
"src/opticfilm_linux/app/qml" = "opticfilm_linux/app/qml"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/qt/**" = ["E402"]
"src/opticfilm_linux/cli.py" = ["T201"]
"src/opticfilm_linux/batch/cli.py" = ["T201"]
